[package]
name = "rash_vm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rash_core.path = "../rash_core"

# For JIT compiling
cranelift = "0.138"
cranelift-native = "0.138"
clear-cache = "0.1"
memmap2 = "0.9"

# "pick random" block
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }

colored = "3"
ordered-float = "5"
pastey = "0.2"
bimap = "0.6"
ecow = "=0.3.1" # Pinned version since crucial for ABI stability
libc = "0.2"

# target-lexicon = "0.13"
