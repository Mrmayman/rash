[package]
name = "rash_vm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rash_core.path = "../rash_core"

# For JIT compiling
cranelift = "0.131"
clear-cache = "0.1.3"
cranelift-native = "0.131"
memmap2 = "0.9"

# "pick random" block
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }

colored = "2"
ordered-float = "4.*"
paste = "1.*"
bimap = "0.6.*"
smol_str = "0.3.6"
