[workspace]
resolver = "2"
members = ["rash", "crates/*"]

[workspace.dependencies]
wgpu = "30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "rayon"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 3
